<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#ffffff" />

		<title>DSH Plugin Market — DeepSeek Harness Plugin Registry</title>
		<meta name="description" content="DSH Plugin Market 是面向 DeepSeek Harness 生态的插件市场与可信注册表，用于发现、验证、评估和安装 DSH plugins。Discover, verify and install DeepSeek Harness plugins with compatibility, security and maintenance signals." />
		<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
		<link rel="canonical" href="https://dsh-plugin.market/" />
		<link rel="sitemap" type="application/xml" title="Sitemap" href="https://dsh-plugin.market/sitemap.xml" />

		<script>
			// Apply the persisted theme before first paint to avoid a flash.
			// Default is light; only a saved "dark" choice switches to dark.
			try {
				if (localStorage.getItem("dsh-market-theme") === "dark") {
					document.documentElement.dataset.theme = "dark";
				}
			} catch (e) {}
		</script>

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="DSH Plugin Market" />
		<meta property="og:title" content="DSH Plugin Market — DeepSeek Harness Plugin Registry" />
		<meta property="og:description" content="Discover, verify and install DeepSeek Harness plugins with compatibility, security and maintenance signals." />
		<meta property="og:url" content="https://dsh-plugin.market/" />
		<meta property="og:image" content="https://dsh-plugin.market/kun.png" />
		<meta property="og:image:alt" content="DSH Plugin Market" />
		<meta property="og:locale" content="zh_CN" />
		<meta property="og:locale:alternate" content="en_US" />

		<meta name="twitter:card" content="summary" />
		<meta name="twitter:image" content="https://dsh-plugin.market/kun.png" />
		<meta name="twitter:title" content="DSH Plugin Market — DeepSeek Harness Plugin Registry" />
		<meta name="twitter:description" content="Discover, verify and install DeepSeek Harness plugins with compatibility, security and maintenance signals." />

		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@graph": [
				{
					"@type": "WebSite",
					"@id": "https://dsh-plugin.market/#website",
					"url": "https://dsh-plugin.market/",
					"name": "DSH Plugin Market",
					"alternateName": ["dsh-plugin market", "DeepSeek Harness Plugin Market"],
					"description": "A trusted plugin registry and discovery platform for the DeepSeek Harness ecosystem.",
					"inLanguage": ["zh-CN", "en"],
					"sameAs": ["https://github.com/0326/dsh-plugin-market"],
					"about": {
						"@type": "SoftwareApplication",
						"name": "DeepSeek Harness",
						"url": "https://github.com/deepseek-ai/deepseek-harness"
					},
					"potentialAction": {
						"@type": "SearchAction",
						"target": {
							"@type": "EntryPoint",
							"urlTemplate": "https://dsh-plugin.market/plugins?q={search_term_string}"
						},
						"query-input": "required name=search_term_string"
					}
				},
				{
					"@type": "WebApplication",
					"@id": "https://dsh-plugin.market/#app",
					"name": "DSH Plugin Market",
					"url": "https://dsh-plugin.market/",
					"applicationCategory": "DeveloperApplication",
					"operatingSystem": "Web",
					"isPartOf": { "@id": "https://dsh-plugin.market/#website" },
					"codeRepository": "https://github.com/0326/dsh-plugin-market"
				}
			]
		}
		</script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
