name: Whitepaper checks

on:
  pull_request:
    paths:
      - "src/react-app/content/whitepaper/**"
      - "src/react-app/components/whitepaper/**"
      - "src/react-app/pages/Whitepaper*"
      - "src/react-app/lib/whitepaper.ts"
      - "src/react-app/whitepaper.css"
      - "public/whitepaper/**"
      - "scripts/whitepaper/**"
      - ".github/workflows/whitepaper-check.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release/content policy
        run: npm run whitepaper:validate
      - name: Compile Markdown + Shiki
        run: npm run whitepaper:build-content
      - name: Validate Mermaid source
        run: npm run whitepaper:diagrams:check
      - name: Build application
        run: npm run build
