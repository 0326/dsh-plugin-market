name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cloudflare resources are created idempotently so the first deploy also
      # provisions the queue and D1 database. The "|| true" swallows the
      # "already exists" error on subsequent runs.
      - name: Create Cloudflare Queue (idempotent)
        run: npx wrangler queues create dsh-plugin-scan || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Creates the D1 database if missing and injects its database_id into
      # wrangler.json, which "wrangler d1 migrations apply --remote" requires.
      - name: Ensure D1 database (create + inject database_id)
        run: node scripts/ensure-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runs before "Build" so it uses the source wrangler.json (no redirect).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Required GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with "Workers Scripts: Edit",
#                           "D1: Edit", and "Workers Queues: Edit" permissions.
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID.
#
# Worker runtime secrets (set once; never committed):
#   wrangler secret put GITHUB_TOKEN         # GitHub PAT the worker uses to call the GitHub API
#   wrangler secret put INTERNAL_API_SECRET  # guards /api/internal/* endpoints
