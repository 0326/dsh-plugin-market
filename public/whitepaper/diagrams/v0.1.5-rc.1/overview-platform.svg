<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness architecture overview</title>
  <desc id="desc">Composition builds a Cordis plugin tree which hosts agent core, capability seams and platform adapters around a durable session log.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="650" rx="28" fill="#f8fafc"/>
  <text x="56" y="64" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#475569">DEEPSEEK HARNESS · v0.1.5-rc.1</text>
  <text x="56" y="104" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#0f172a">Composition → Runtime → Durable State → Product Surface</text>
  <g filter="url(#shadow)">
    <rect x="56" y="156" width="250" height="132" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="80" y="190" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">COMPOSITION</text>
    <text x="80" y="225" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Profile · Bundle · Patch</text>
    <text x="80" y="258" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">决定启动时挂载的插件树</text>
    <rect x="376" y="156" width="688" height="132" rx="18" fill="#111827"/>
    <text x="402" y="190" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#94a3b8">CORDIS CONTEXT / PLUGIN TREE</text>
    <text x="402" y="225" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Everything is composed as plugins</text>
    <text x="402" y="258" font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">Service · Event · Effect · scoped lifecycle</text>
  </g>
  <line x1="306" y1="222" x2="362" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="56" y="342" width="314" height="182" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="378" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">AGENT CORE</text>
    <text x="82" y="415" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Agent Loop</text>
    <text x="82" y="447" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Session · Prompt · Tools · Agent</text>
    <rect x="82" y="475" width="258" height="28" rx="14" fill="#eef2ff"/>
    <text x="211" y="494" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#4338ca">TURN / STEP / REQUEST</text>
    <rect x="403" y="342" width="314" height="182" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="429" y="378" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">CAPABILITY SEAMS</text>
    <text x="429" y="415" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Swappable providers</text>
    <text x="429" y="447" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">LLM · FS · Shell · Web · Skill</text>
    <text x="429" y="477" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Subagent · Workflow · Sandbox</text>
    <rect x="750" y="342" width="314" height="182" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="776" y="378" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">PRODUCT SURFACE</text>
    <text x="776" y="415" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Multiple applications</text>
    <text x="776" y="447" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Web · Headless · SDK · ACP</text>
    <text x="776" y="477" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Host · Client · Desktop</text>
  </g>
