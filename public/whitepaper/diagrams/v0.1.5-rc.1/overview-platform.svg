  <rect x="248" y="572" width="624" height="48" rx="24" fill="#0f172a"/>
  <text x="560" y="602" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Durable Session Log · model-visible history · projections · persistence</text>
  <line x1="213" y1="524" x2="382" y2="582" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="907" y1="524" x2="738" y2="582" stroke="#94a3b8" stroke-width="1.5"/>
