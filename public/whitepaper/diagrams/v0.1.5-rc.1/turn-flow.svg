<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">DSH v0.1.5-rc.1 agent turn flow</title>
  <desc id="desc">A user message enters the agent loop, is admitted into a step, streamed through the model and tool pipeline, and settled into a session log held by a lifecycle-owned write handle.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1120" height="760" rx="28" fill="#f8fafc"/>
  <text x="56" y="60" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#475569">AGENT RUNTIME · v0.1.5-rc.1</text>
  <text x="56" y="98" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#0f172a">One turn may contain multiple model steps</text>
  <g font-family="Inter,Arial,sans-serif">
    <g font-size="15" font-weight="700" fill="#0f172a">
      <rect x="52" y="132" width="168" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="136" y="162" text-anchor="middle">User / Inbox</text>
      <rect x="286" y="132" width="210" height="48" rx="14" fill="#111827"/><text x="391" y="162" text-anchor="middle" fill="#fff">Agent Loop</text>
      <rect x="562" y="132" width="168" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="646" y="162" text-anchor="middle">LLM</text>
      <rect x="796" y="132" width="120" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="856" y="162" text-anchor="middle">Tools</text>
      <rect x="952" y="132" width="120" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="1012" y="162" text-anchor="middle">Session</text>
    </g>
    <g stroke="#cbd5e1" stroke-dasharray="6 7"><line x1="136" y1="190" x2="136" y2="700"/><line x1="391" y1="190" x2="391" y2="700"/><line x1="646" y1="190" x2="646" y2="700"/><line x1="856" y1="190" x2="856" y2="700"/><line x1="1012" y1="190" x2="1012" y2="700"/></g>
    <rect x="306" y="205" width="170" height="44" rx="12" fill="#e0e7ff"/><text x="391" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">turn/start · claim</text>
    <line x1="136" y1="227" x2="292" y2="227" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
    <rect x="286" y="270" width="210" height="72" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="391" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Assemble + pre-step</text><text x="391" y="320" text-anchor="middle" font-size="12" fill="#64748b">prompt · tools · runtime context</text>
    <rect x="286" y="365" width="210" height="72" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="391" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Request admission</text><text x="391" y="415" text-anchor="middle" font-size="12" fill="#64748b">step/start · request · prepareCall</text>
    <line x1="496" y1="401" x2="632" y2="401" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="564" y="388" text-anchor="middle" font-size="11" fill="#2563eb">frozen request</text>
    <line x1="496" y1="447" x2="998" y2="447" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="750" y="436" text-anchor="middle" font-size="11" fill="#2563eb">system / user / request events</text>
    <line x1="632" y1="486" x2="406" y2="486" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="474" text-anchor="middle" font-size="11" fill="#475569">assistant stream</text>
    <line x1="406" y1="528" x2="842" y2="528" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="620" y="516" text-anchor="middle" font-size="11" fill="#2563eb">tool/call</text>
    <line x1="842" y1="570" x2="406" y2="570" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="558" text-anchor="middle" font-size="11" fill="#475569">tool/result</text>
    <line x1="406" y1="612" x2="998" y2="612" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="703" y="600" text-anchor="middle" font-size="11" fill="#2563eb">assistant / tool settlement</text>
    <rect x="306" y="635" width="170" height="44" rx="12" fill="#dcfce7"/><text x="391" y="662" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">step/end</text>
    <path d="M391 679 C391 714 646 714 646 658 C646 635 528 635 496 635" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="930" y="676" width="164" height="44" rx="22" fill="#0f172a"/><text x="1012" y="703" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">turn/end</text>
    <text x="1012" y="647" text-anchor="middle" font-size="11" fill="#64748b">SessionHandle owns write lifecycle</text>
  </g>
</svg>