<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">DSH agent turn flow</title><desc id="desc">A user message is claimed by the agent loop, turned into one or more model steps and tool calls, and committed to the session log.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1120" height="720" rx="28" fill="#f8fafc"/>
  <text x="56" y="60" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#475569">AGENT RUNTIME · TURN / STEP</text>
  <text x="56" y="98" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#0f172a">One turn may contain multiple model steps</text>

  <g font-family="Inter,Arial,sans-serif">
    <g font-size="15" font-weight="700" fill="#0f172a">
      <rect x="52" y="132" width="168" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="136" y="162" text-anchor="middle">User / Inbox</text>
      <rect x="286" y="132" width="210" height="48" rx="14" fill="#111827"/><text x="391" y="162" text-anchor="middle" fill="#fff">Agent Loop</text>
      <rect x="562" y="132" width="168" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="646" y="162" text-anchor="middle">LLM</text>
      <rect x="796" y="132" width="120" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="856" y="162" text-anchor="middle">Tools</text>
      <rect x="952" y="132" width="120" height="48" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="1012" y="162" text-anchor="middle">Session</text>
    </g>
    <g stroke="#cbd5e1" stroke-dasharray="6 7"><line x1="136" y1="190" x2="136" y2="662"/><line x1="391" y1="190" x2="391" y2="662"/><line x1="646" y1="190" x2="646" y2="662"/><line x1="856" y1="190" x2="856" y2="662"/><line x1="1012" y1="190" x2="1012" y2="662"/></g>

    <rect x="306" y="210" width="170" height="44" rx="12" fill="#e0e7ff"/><text x="391" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">turn/start · claim</text>
    <line x1="136" y1="232" x2="292" y2="232" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="286" y="278" width="210" height="66" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="391" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Assemble request surface</text><text x="391" y="326" text-anchor="middle" font-size="12" fill="#64748b">prompt · tools · pre-step</text>
    <line x1="496" y1="311" x2="632" y2="311" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="564" y="300" text-anchor="middle" font-size="11" fill="#2563eb">prepared request</text>

    <line x1="632" y1="374" x2="406" y2="374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="362" text-anchor="middle" font-size="11" fill="#475569">assistant stream</text>
    <line x1="406" y1="422" x2="842" y2="422" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="620" y="410" text-anchor="middle" font-size="11" fill="#2563eb">tool/call</text>
    <line x1="842" y1="470" x2="406" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="620" y="458" text-anchor="middle" font-size="11" fill="#475569">tool/result</text>

    <line x1="406" y1="518" x2="998" y2="518" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/><text x="703" y="506" text-anchor="middle" font-size="11" fill="#2563eb">durable events / settlement</text>
    <rect x="306" y="548" width="170" height="44" rx="12" fill="#dcfce7"/><text x="391" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">step/end</text>

    <path d="M391 592 C391 624 646 624 646 574 C646 548 528 548 496 548" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="586" y="643" text-anchor="middle" font-size="12" fill="#64748b">tool/input owes another request → next step</text>
    <rect x="930" y="610" width="164" height="44" rx="22" fill="#0f172a"/><text x="1012" y="637" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">turn/end</text>
    <line x1="476" y1="570" x2="916" y2="632" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>